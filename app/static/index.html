<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a2166">
  <meta name="description" content="Meu Dia — organize suas atividades, prioridades e o tempo do seu dia.">
  <title>Meu Dia — organize seu tempo com leveza</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5efc'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita "piscar").
    try {
      const t = localStorage.getItem("meudia_tema") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
      document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 3v4M17 5h4"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#/hoje" aria-label="Meu Dia, início">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg></span>
        <span class="brand-name">meu<b>dia</b></span>
      </a>
      <nav class="nav">
        <a href="#/hoje" data-rota="hoje"><svg class="ic"><use href="#i-sun"/></svg> Hoje</a>
        <a href="#/semana" data-rota="semana"><svg class="ic"><use href="#i-calendar"/></svg> Semana</a>
        <a href="#/atividades" data-rota="atividades"><svg class="ic"><use href="#i-list"/></svg> Atividades</a>
        <a href="#/resumo" data-rota="resumo"><svg class="ic"><use href="#i-chart"/></svg> Resumo</a>
      </nav>
      <button class="btn btn-grad btn-block" data-abrir-modal type="button"><svg class="ic"><use href="#i-plus"/></svg> Nova atividade</button>
      <div class="side-card">
        <svg class="ic"><use href="#i-spark"/></svg>
        <p id="frase">Um passo de cada vez.</p>
      </div>
      <button class="theme-toggle" id="tema" type="button" aria-label="Alternar tema claro/escuro">
        <svg class="ic ic-sol"><use href="#i-sun"/></svg><svg class="ic ic-lua"><use href="#i-moon"/></svg>
        <span id="tema-rotulo">Tema</span>
      </button>
    </aside>

    <main class="main" id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <nav class="tabbar" aria-label="Navegação">
    <a href="#/hoje" data-rota="hoje"><svg class="ic"><use href="#i-sun"/></svg><span>Hoje</span></a>
    <a href="#/semana" data-rota="semana"><svg class="ic"><use href="#i-calendar"/></svg><span>Semana</span></a>
    <button class="tab-add" data-abrir-modal type="button" aria-label="Nova atividade"><svg class="ic"><use href="#i-plus"/></svg></button>
    <a href="#/atividades" data-rota="atividades"><svg class="ic"><use href="#i-list"/></svg><span>Atividades</span></a>
    <a href="#/resumo" data-rota="resumo"><svg class="ic"><use href="#i-chart"/></svg><span>Resumo</span></a>
  </nav>

  <dialog id="modal" class="modal" aria-labelledby="modal-titulo">
    <form id="form" method="dialog" autocomplete="off">
      <header class="modal-head">
        <h2 id="modal-titulo">Nova atividade</h2>
        <button type="button" class="icon-btn" data-fechar aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
      </header>
      <label class="campo">O que você precisa fazer?
        <input id="f-titulo" class="input" type="text" maxlength="150" placeholder="Ex.: estudar programação" required>
      </label>
      <div class="linha">
        <label class="campo">Data<input id="f-data" class="input" type="date" required></label>
        <label class="campo">Horário <small>opcional</small><input id="f-horario" class="input" type="time"></label>
      </div>
      <div class="campo">
        <label for="f-duracao">Duração (minutos)</label>
        <input id="f-duracao" class="input" type="number" min="1" max="1440" value="30" required>
        <div class="chips-rapidos" id="duracoes">
          <button type="button" data-min="15">15 min</button><button type="button" data-min="30">30 min</button>
          <button type="button" data-min="45">45 min</button><button type="button" data-min="60">1 h</button>
          <button type="button" data-min="90">1h30</button><button type="button" data-min="120">2 h</button>
        </div>
      </div>
      <fieldset class="campo prio-set">
        <legend>Prioridade</legend>
        <label class="prio-op alta"><input type="radio" name="prioridade" value="alta"><span>Alta</span></label>
        <label class="prio-op media"><input type="radio" name="prioridade" value="media" checked><span>Média</span></label>
        <label class="prio-op baixa"><input type="radio" name="prioridade" value="baixa"><span>Baixa</span></label>
      </fieldset>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-fechar>Cancelar</button>
        <button type="submit" class="btn btn-grad" id="f-salvar">Salvar atividade</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirmar" class="modal modal-sm" aria-labelledby="confirmar-texto">
    <form method="dialog">
      <h2 id="confirmar-texto">Excluir esta atividade?</h2>
      <p class="muted" id="confirmar-detalhe"></p>
      <footer class="modal-foot">
        <button class="btn btn-ghost" value="nao">Cancelar</button>
        <button class="btn btn-danger" value="sim">Excluir</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
